/* animated number */
function countUp(el, to, fmt) {
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduce) { el.textContent = fmt(to); return; }
  const t0 = performance.now(), dur = 800;
  const step = now => { const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3); el.textContent = fmt(to * e); if (k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}

/* ================= metrics ================= */
let PERIOD = "12";
let M = null;
const sum = a => a.reduce((s, v) => s + (v || 0), 0);
const avg = a => a.length ? sum(a) / a.length : 0;
const inR = (d, a, b) => d >= a && d <= b;
const svcKind = s => P.services[s]?.kind || "oneoff";
const METHOD_IT = { "Card": "Carta", "Cash": "Contanti", "Bank transfer": "Bonifico", "Insurance": "Assicurazione", "Other": "Altro" };
const trMethod = m => LANG === "it" ? (METHOD_IT[m] || m) : m;

function rangeFor(p) {
  const end = NOW; let start;
  if (p === "30") start = new Date(+NOW - 30 * DAY);
  else if (p === "90") start = new Date(+NOW - 90 * DAY);
  else if (p === "12") start = new Date(NOW.getFullYear() - 1, NOW.getMonth(), NOW.getDate() + 1);
  else start = START;
  const len = end - start;
  const prev = p === "all" ? null : { a: new Date(+start - len), b: new Date(+start - 1) };
  return { a: start, b: end, prev, months: len / DAY / 30.44 };
}

function computeMonthly() {
  const z = () => new Array(NM).fill(0);
  M = { rev: z(), ext: z(), svc: P.services.map(z), mrr: z(), newC: z(), leads: z(), books: z(), noshow: z(), active: z(), extN: z(), svcN: z() };
  const act = Array.from({ length: NM }, () => new Set());
  for (const x of DB.txns) {
    const mi = monthIdx(x.d); if (mi < 0 || mi >= NM || x.st === "refund") continue;
    M.rev[mi] += x.a; act[mi].add(x.c);
    if (x.k === "ext") { M.ext[mi] += x.a; M.extN[mi]++; }
    else { (M.svc[x.s] || M.svc[0])[mi] += x.a; M.svcN[mi]++; if (svcKind(x.s) === "sub") M.mrr[mi] += x.a; }
  }
  for (const b of DB.books) { const mi = monthIdx(b.d); if (mi < 0 || mi >= NM) continue; M.books[mi]++; if (b.ns) M.noshow[mi]++; if (!P.services[b.s]?.trial) act[mi].add(b.c); }
  for (const c of DB.clients) {
    const li = monthIdx(c.created); if (li >= 0 && li < NM) M.leads[li]++;
    if (c.first) { const fi = monthIdx(c.first); if (fi >= 0 && fi < NM) M.newC[fi]++; }
  }
  M.act = act; M.active = act.map(s => s.size);
  // forecast
  const pf = Math.max(.08, NOW.getDate() / daysIn(NOW.getFullYear(), NOW.getMonth()));
  const cur = M.rev[NM - 1] / pf;
  const last6 = sum(M.rev.slice(NM - 7, NM - 1)), prev6 = sum(M.rev.slice(NM - 19, NM - 13));
  const hasYear = prev6 > 0 && M.rev.slice(0, 12).filter(v => v > 0).length >= 6;
  const g = hasYear ? clamp(last6 / prev6, .6, 1.8) : 1;
  const recent = avg(M.rev.slice(NM - 4, NM - 1).filter(v => v > 0)) || cur;
  const fc = new Array(NM + 6).fill(null); fc[NM - 1] = cur;
  for (let k = 1; k <= 6; k++) { const ly = M.rev[NM - 1 + k - 12]; fc[NM - 1 + k] = hasYear && ly > 0 ? ly * g : recent; }
  let next12 = 0;
  for (let k = 1; k <= 12; k++) { const ly = k === 12 ? cur : M.rev[NM - 1 + k - 12]; next12 += hasYear && ly > 0 ? ly * g : recent; }
  M.fc = fc; M.g = g; M.cur = cur; M.next12 = next12; M.hasYear = hasYear;
}

function periodStats(a, b) {
  let rev = 0, ext = 0, svcN = 0, extN = 0, pend = 0; const paying = new Set();
  for (const x of DB.txns) { if (!inR(x.d, a, b) || x.st === "refund") continue; rev += x.a; paying.add(x.c); if (x.k === "ext") { ext += x.a; extN++; } else svcN++; if (x.st === "pending") pend += x.a; }
  let books = 0, ns = 0; for (const bk of DB.books) if (inR(bk.d, a, b)) { books++; if (bk.ns) ns++; }
  let newC = 0, leads = 0; for (const c of DB.clients) { if (c.first && inR(c.first, a, b)) newC++; if (inR(c.created, a, b)) leads++; }
  let rep = 0; for (const id of paying) if (DB.clients[id].n >= 2 || DB.clients[id].subMonths >= 2) rep++;
  return { rev, ext, svcN, extN, pend, paying: paying.size, books, ns, newC, leads, repeat: paying.size ? rep / paying.size : 0, arpc: paying.size ? rev / paying.size : 0 };
}
function lifetimeValue() { const paid = DB.clients.filter(c => c.first); return paid.length ? avg(paid.map(c => c.spent)) : 0; }

function channelStats(a, b, months) {
  return P.channels.map((ch, i) => {
    const cl = DB.clients.filter(c => c.ch === i);
    const born = cl.filter(c => inR(c.created, a, b));
    const conv = born.length ? born.filter(c => c.first).length / born.length : 0;
    const newPaid = cl.filter(c => c.first && inR(c.first, a, b)).length;
    let rev = 0; for (const c of cl) for (const ti of c.txIdx) { const x = DB.txns[ti]; if (inR(x.d, a, b) && x.st !== "refund") rev += x.a; }
    const spend = (ch.spend || 0) * months + (ch.comm || 0) * rev;
    const paidAll = cl.filter(c => c.first);
    const ltv = paidAll.length ? avg(paidAll.map(c => c.spent)) : 0;
    return { i, name: tr(ch.n), leads: born.length, conv, newPaid, rev, spend, cac: newPaid ? spend / newPaid : null, ltv, roi: spend ? rev / spend : null, clients: paidAll.length, comm: ch.comm || 0 };
  });
}

function cohorts(mode) {
  const rows = [];
  for (let m0 = Math.max(0, NM - 12); m0 < NM; m0++) {
    const members = DB.clients.filter(c => c.first && monthIdx(c.first) === m0);
    const cells = [];
    if (mode === "rev") {
      const cum = new Array(NM - m0).fill(0);
      for (const c of members) for (const ti of c.txIdx) { const x = DB.txns[ti]; const k = monthIdx(x.d) - m0; if (k >= 0 && k < cum.length && x.st !== "refund") cum[k] += x.a; }
      let run = 0; for (let k = 0; k < cum.length; k++) { run += cum[k]; cells.push(members.length ? run / members.length : null); }
    } else {
      for (let k = 0; m0 + k < NM; k++) { const s = M.act[m0 + k]; cells.push(members.length ? members.filter(c => s.has(c.id)).length / members.length : null); }
    }
    rows.push({ m0, n: members.length, cells });
  }
  return rows;
}

function churnSeries() {
  const out = [];
  for (let m = NM - 12; m < NM; m++) {
    const prev = M.act[m - 1], cur = M.act[m]; if (!prev || !prev.size) { out.push(null); continue; }
    let lost = 0; for (const id of prev) if (!cur.has(id)) lost++;
    out.push(lost / prev.size);
  }
  return out;
}

function heatData(a, b) {
  const hrsSeen = DB.books.filter(x => inR(x.d, a, b)).map(x => x.d.getHours());
  const keys = Object.keys(P.hours || {}).map(Number);
  const lo = Math.min(...(hrsSeen.length ? hrsSeen : keys.length ? keys : [8])), hi = Math.max(...(hrsSeen.length ? hrsSeen : keys.length ? keys : [20]));
  const H0 = clamp(lo, 0, 23), H1 = clamp(Math.max(hi, H0 + 4), 0, 23);
  const grid = Array.from({ length: 7 }, () => new Array(H1 - H0 + 1).fill(0));
  for (const x of DB.books) { if (!inR(x.d, a, b)) continue; const h = x.d.getHours(); if (h < H0 || h > H1) continue; grid[(x.d.getDay() + 6) % 7][h - H0]++; }
  return { H0, H1, grid };
}

function weeklyUtil() {
  const weeks = 26, out = [], labels = [];
  const end = new Date(NOW); end.setHours(0, 0, 0, 0); end.setDate(end.getDate() - ((end.getDay() + 6) % 7)); // this Monday
  for (let w = weeks - 1; w >= 0; w--) {
    const a = new Date(+end - w * 7 * DAY), b = new Date(+a + 7 * DAY - 1);
    let n = 0; for (const x of DB.books) if (inR(x.d, a, b) && !x.ns) n++;
    out.push(n); labels.push(fdate(a, { day: "numeric", month: "short" }));
  }
  return { out, labels };
}

/* consulting impact: post-start months vs the same calendar months one year earlier */
function impactStats() {
  const s = P.consultStart; if (!s) return null;
  const si = monthIdx(s); if (si < 12 || si > NM - 1) return { tooEarly: si <= NM - 1 && si >= 0, si };
  const pf = Math.max(.08, NOW.getDate() / daysIn(NOW.getFullYear(), NOW.getMonth()));
  const months = []; for (let m = si; m < NM; m++) months.push(m);
  const scale = m => m === NM - 1 ? 1 / pf : 1;
  const after = k => sum(months.map(m => M[k][m] * scale(m))), before = k => sum(months.map(m => M[k][m - 12] * scale(m)));
  const ratio = (x, y) => y > 0 ? x / y - 1 : null;
  const attachA = sum(months.map(m => M.extN[m])) / Math.max(1, sum(months.map(m => M.svcN[m])));
  const attachB = sum(months.map(m => M.extN[m - 12])) / Math.max(1, sum(months.map(m => M.svcN[m - 12])));
  const tickA = after("rev") / Math.max(1, sum(months.map(m => M.svcN[m] * scale(m)))), tickB = before("rev") / Math.max(1, sum(months.map(m => M.svcN[m - 12] * scale(m))));
  return {
    si, n: months.length,
    rev: [before("rev"), after("rev"), ratio(after("rev"), before("rev"))],
    newC: [before("newC"), after("newC"), ratio(after("newC"), before("newC"))],
    attach: [attachB, attachA, attachA - attachB],
    ticket: [tickB, tickA, ratio(tickA, tickB)],
  };
}

function addClient(o) {

}
function addPayment(c, o) {
  const tx = { id: DB.txns.length, c: c.id, d: o.d, k: o.k, s: o.s, a: Math.round(o.a * 100) / 100, m: o.m || "Card", st: o.st || "paid" };
  DB.txns.push(tx); c.txIdx.push(tx.id);
  if (o.k === "svc" && P.services[o.s]?.kind === "sub") { c.subActive = true; c.sub = o.s; }
  if (o.logSession) addSession(c, { d: o.sd || o.d, s: o.s, ns: 0 }, true);

  return tx;
}
function addSession(c, o, quiet) {

  else DB.books.push({ c: c.id, d: o.d, s: o.s, ns: o.ns || 0, size: c.size });
  if (!quiet) refreshClient(DB, c);
}
function deleteClient(c) {

  if (STORE.active && c.key) STORE.removeClient(c);

  DB.clients = DB.clients.filter(x => x.id !== id);
  DB.clients.forEach(x => { map.set(x.id, n); x.id = n++; });
  DB.txns = DB.txns.filter(x => x.c !== id).map((x, i) => ({ ...x, id: i, c: map.get(x.c) }));
  DB.books = DB.books.filter(x => x.c !== id).map(x => ({ ...x, c: map.get(x.c) }));
  DB.upcoming = (DB.upcoming || []).filter(x => x.c !== id).map(x => ({ ...x, c: map.get(x.c) }));

}

VIEWS.schedule = el => {
  const r = rangeFor(PERIOD), S1 = periodStats(r.a, r.b);

  const hd = heatData(r.a, r.b), flat = hd.grid.flat(), max = Math.max(1, ...flat);
  let best = [0, 0, -1], worst = [0, 0, Infinity];

  const slot = ([d, hh]) => tr(I.dayNames)[d] + " " + String(hd.H0 + hh).padStart(2, "0") + ":00";
  const u = weeklyUtil(), avgU = avg(u.out.slice(-8)) / (P.capacity || 1);
  h += `<div class="kpis">
    <div class="kpi" style="--kc:var(--sun)"><span class="lab"><i></i>${t("util")}</span><span class="val">${pct(avgU)}</span><span class="hint">${L("avg of the last 8 weeks, capacity", "media ultime 8 settimane, capacità")} ${nf(P.capacity)}/${L("wk", "sett.")}</span></div>
    <div class="kpi" style="--kc:var(--coral)"><span class="lab"><i></i>${t("noshow")}</span><span class="val">${pct(S1.books ? S1.ns / S1.books : 0, 1)}</span><span class="hint">${nf(S1.ns)} ${L("missed in the period", "mancate nel periodo")}</span></div>
    <div class="kpi" style="--kc:var(--lime)"><span class="lab"><i></i>${t("busiest")}</span><span class="val" style="font-size:1.4rem">${best[2] > 0 ? slot(best) : "—"}</span><span class="hint">${nf(best[2])} ${L("bookings", "prenotazioni")}</span></div>
    <div class="kpi" style="--kc:var(--blue)"><span class="lab"><i></i>${t("quietest")}</span><span class="val" style="font-size:1.4rem">${worst[2] < Infinity ? slot(worst) : "—"}</span><span class="hint">${L("a slot to fill with an offer", "una fascia da riempire con un'offerta")}</span></div>
  </div>
  <div class="grid">
    <div class="panel c8"><div class="ph"><div><h3>${t("heat")}</h3><p>${t("heatSub")}</p></div><div class="heat-scale">${L("fewer", "meno")}${[10, 35, 60, 85, 100].map(p => `<i style="background:color-mix(in srgb, var(--coral) ${p}%, #fff)"></i>`).join("")}${L("more", "più")}</div></div><div class="heat-scroll"><div class="heat" style="grid-template-columns:40px repeat(${hd.H1 - hd.H0 + 1},minmax(26px,1fr));min-width:${60 + (hd.H1 - hd.H0 + 1) * 28}px"><span></span>${[...Array(hd.H1 - hd.H0 + 1)].map((_, i) => `<span style="text-align:center">${hd.H0 + i}</span>`).join("")}${hd.grid.map((row, d) => `<span class="hl">${tr(I.dayNames)[d]}</span>${row.map((v, hh) => `<span class="cell" style="background:${v ? `color-mix(in srgb, var(--coral) ${Math.round(8 + v / max * 92)}%, #fff)` : "var(--soft)"}" data-tip="${esc(tr(I.dayNames)[d] + " " + (hd.H0 + hh) + ":00 · " + v)}"></span>`).join("")}`).join("")}</div></div></div>
    <div class="panel c4"><div class="ph"><div><h3>${t("upcoming")}</h3><p>${t("upcomingSub")}</p></div></div><div class="list" id="scU"></div></div>
    <div class="panel c12"><div class="ph"><div><h3>${t("util")}</h3><p>${t("utilSub")}</p></div><div class="legend"><span><i style="background:var(--sun)"></i>${L("Sessions held", "Sessioni svolte")}</span><span><i class="dash" style="border-color:var(--ink)"></i>${L("Capacity", "Capacità")}</span></div></div><div id="scW"></div></div>
  </div>`;
  el.innerHTML = h;
  upcomingList($("#scU", el), 9);
  lineChartWithBars($("#scW", el), u);
};
function lineChartWithBars(host, u) {
  barChart(host, { labels: u.labels, series: [{ name: L("Sessions", "Sessioni"), color: cssv("--sun"), values: u.out }], fmt: v => nf(v), h: 220 });
  const svg = $("svg", host); if (!svg) return;
  const vb = svg.viewBox.baseVal, ih = vb.height - 34;
  const max = niceMax(Math.max(...u.out) * 1.05).max;
  if (P.capacity <= max) { const y = 10 + ih - P.capacity / max * ih; S("line", { x1: 46, x2: vb.width - 6, y1: y, y2: y, stroke: cssv("--ink"), "stroke-width": 1.5, "stroke-dasharray": "5 4" }, svg); }

const FMT = {};
function slider(id, label, min, max, step, v, fmt, help) { FMT[id] = fmt; return `<div class="sl"><div class="top-row"><label for="${id}">${esc(label)}</label><output for="${id}">${fmt(v)}</output></div><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${v}" data-fmt="1"><small>${esc(help)}</small></div>`; }
function firstYearValue() {
  const cohort = DB.clients.filter(c => c.first && monthIdx(c.first) >= NM - 24 && monthIdx(c.first) < NM - 12);
  if (cohort.length >= 5) return avg(cohort.map(c => sum(c.txIdx.map(i => DB.txns[i]).filter(x => x.d - c.first < 365 * DAY).map(x => x.a))));
  return lifetimeValue();
}
function drawSim(attach, S1) {
  const base = M.next12, e = P.elasticity || -.4, p = SIM.price / 100;
  const priceEff = base * ((1 + p) * (1 + e * p) - 1);
  const fyv = firstYearValue(), newEff = SIM.newc * 12 * fyv * .55;
  const tick = S1.svcN ? (S1.rev - S1.ext) / S1.svcN : 0;
  const retEff = S1.paying * (SIM.ret / 100) * tick * (P.oneoff ? 1 : 3);
  const extAvg = S1.extN ? S1.ext / S1.extN : avg(P.extras.map(x => x.p));
  const extEff = (S1.svcN * (M.next12 / (S1.rev || 1))) * (SIM.ext / 100 - Math.round(attach * 100) / 100) * extAvg;
  const cs = channelStats(rangeFor("12").a, NOW, 12).filter(c => c.cac > 0 && c.clients >= 3).sort((a, b) => b.ltv / b.cac - a.ltv / a.cac)[0];
  const mktEff = cs ? (SIM.mkt / cs.cac) * 12 * fyv * .55 - SIM.mkt * 12 : 0;
  const corpEff = SIM.corp && P.corp ? P.corp.deals * 12 * P.corp.ticket * .6 - P.corp.cost * 12 : 0;
  const parts = [[t("s_price"), priceEff, "--blue"], [t("s_new"), newEff, "--coral"], [t("s_ret"), retEff, "--violet"], [t("s_ext"), extEff, "--pink"], [t("s_mkt") + (cs ? " · " + cs.name : ""), mktEff, "--sun"], ...(P.corp ? [[L("LinkedIn / companies", "LinkedIn / aziende"), corpEff, "--teal"]] : [])];
  const total = base + sum(parts.map(x => x[1])), d = total - base;
  $("#simV").textContent = eur(total);
  const dd = $("#simD"); dd.textContent = (d >= 0 ? "+" : "−") + eur(Math.abs(d)) + " (" + (d >= 0 ? "+" : "−") + pct(Math.abs(d) / base, 1) + ")"; dd.classList.toggle("neg", d < 0);
  const mx = Math.max(1, ...parts.map(x => Math.abs(x[1])));
  $("#simB").innerHTML = parts.map(([l, v, c]) => `<div class="cb"><span>${esc(l)}</span><em style="color:${v < 0 ? "var(--bad)" : v > 0 ? "var(--good)" : "var(--muted)"}">${v >= 0 ? "+" : "−"}${eur(Math.abs(v))}</em><div class="tr"><i style="left:50%;width:${Math.abs(v) / mx * 50}%;${v < 0 ? "transform:translateX(-100%);" : ""}background:var(${c})"></i></div></div>`).join("");
  // monthly curve: baseline per month, scenario ramps in over 3 months
  const labels = [], b = [], s = [];
  for (let k = 1; k <= 12; k++) { const ly = k === 12 ? M.cur : M.rev[NM - 1 + k - 12]; const bv = M.hasYear && ly > 0 ? ly * M.g : M.next12 / 12; labels.push(monthLabel(NM - 1 + k, true)); b.push(bv); }
  const bsum = sum(b) || 1, ramp = k => Math.min(1, k / 3);
  const rsum = sum(b.map((v, i) => v * ramp(i + 1)));
  b.forEach((v, i) => s.push(v + d * (v * ramp(i + 1)) / (rsum || bsum)));
  lineChart($("#simC"), { labels, series: [{ name: t("baseline"), color: cssv("--slate"), values: b, dash: 1, noDot: 1 }, { name: L("Scenario", "Scenario"), color: cssv("--lime"), values: s, area: 1 }], h: 220 });
}

/* ================= analytics that depend on how the professional sells =================
   Free trials (trial service), packages of sessions (credit left), client results (start vs latest
   value of a field), and a split by a profession field. Each one switches on only when the data has it. */
const median = a => { if (!a.length) return 0; const s = [...a].sort((x, y) => x - y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
const trialSvc = () => P.services.findIndex(s => s.trial);
const isTrial = i => !!P.services[i]?.trial;
const monthEnd = i => new Date(+monthDate(i + 1) - 1);

function trialStats(a, b) {
  const ti = trialSvc(); if (ti < 0) return null;
  const first = new Map();
  for (const bk of DB.books) if (bk.s === ti && !first.has(bk.c)) first.set(bk.c, bk.d);
  const upcoming = (DB.upcoming || []).filter(u => u.s === ti && +u.d - NOW < 7 * DAY);
  const byM = new Array(NM).fill(0), byMc = new Array(NM).fill(0), days = [];
  let n = 0, conv = 0, mature = 0, matureConv = 0;
  for (const [cid, d] of first) {
    const c = DB.clients[cid]; if (!c) continue;
    const ok = !!(c.first && c.first >= new Date(+d - DAY));
    const mi = monthIdx(d); if (mi >= 0 && mi < NM) { byM[mi]++; if (ok) byMc[mi]++; }
    if (!inR(d, a, b)) continue;
    n++; if (ok) { conv++; days.push((c.first - d) / DAY); }
    if (NOW - d > 21 * DAY) { mature++; if (ok) matureConv++; }
  }
  const leads = DB.clients.filter(c => inR(c.created, a, b)).length;
  return { n, conv, rate: mature ? matureConv / mature : n ? conv / n : 0, days: days.length ? median(days) : null, byM, byMc, upcoming: upcoming.length, leads, takeRate: leads ? n / leads : 0 };
}

// latest pack of every client: how many sessions are used, booked and left
function packCredit() {
  const out = [];
  for (const c of DB.clients) {
    const packs = c.txIdx.map(i => DB.txns[i]).filter(x => x.k === "svc" && svcKind(x.s) === "pack" && x.st !== "refund");
    if (!packs.length) continue;
    const p = packs[packs.length - 1], total = +P.services[p.s]?.sessions || 10, from = +p.d - DAY;
    const used = DB.books.filter(b => b.c === c.id && +b.d >= from && !isTrial(b.s)).length;
    const booked = (DB.upcoming || []).filter(u => u.c === c.id && !isTrial(u.s)).length;
    const lastSess = DB.books.filter(b => b.c === c.id && !isTrial(b.s)).reduce((m, b) => b.d > m ? b.d : m, null);
    out.push({ c, p, total, used: Math.min(used, total), booked: Math.max(0, Math.min(booked, total - used)), left: Math.max(0, total - used - booked), lastSess });
  }
  return out;
}
function renewalsDue() {
  return packCredit().filter(x => x.left <= 1 && x.lastSess && NOW - x.lastSess < 35 * DAY).sort((a, b) => a.left - b.left || b.lastSess - a.lastSess);
}
const dots = x => { let h = ""; for (let i = 0; i < x.total; i++) h += `<i class="${i < x.used ? "u" : i < x.used + x.booked ? "b" : "l"}"></i>`; return `<span class="dots" role="img" aria-label="${x.used} ${L("used", "usate")}, ${x.booked} ${L("booked", "prenotate")}, ${x.left} ${L("left", "rimaste")}">${h}</span>`; };

// results: the first field pair that records a start and a latest value
const RESULT_PAIRS = [
  { a: "level0", b: "level1", kind: "level", lab: () => L("Level", "Livello") },
  { a: "score0", b: "score1", kind: "up", unit: "%", lab: () => L("Grade", "Voto") },
  { a: "pain0", b: "pain1", kind: "down", unit: "/10", lab: () => L("Pain", "Dolore") },
  { a: "kg0", b: "kg1", kind: "change", unit: " kg", lab: () => L("Weight", "Peso") },
];
function resultsStats() {
  const pr = RESULT_PAIRS.find(r => P.fields.some(f => f.k === r.a) && P.fields.some(f => f.k === r.b)); if (!pr) return null;
  const has = v => v !== "" && v != null;
  const rows = DB.clients.filter(c => c.first && has(c.f[pr.a]) && has(c.f[pr.b]));
  if (rows.length < 3) return { pr, n: rows.length };
  const delta = c => pr.kind === "level" ? LEVELS.indexOf(c.f[pr.b]) - LEVELS.indexOf(c.f[pr.a]) : pr.kind === "down" ? c.f[pr.a] - c.f[pr.b] : pr.kind === "change" ? Math.abs(c.f[pr.b] - c.f[pr.a]) : c.f[pr.b] - c.f[pr.a];
  const ds = rows.map(delta).filter(v => !isNaN(v));
  const improved = ds.filter(v => v > (pr.kind === "change" ? .9 : 0)).length;
  const top = [...rows].sort((x, y) => delta(y) - delta(x)).slice(0, 5);
  const months = rows.map(c => Math.max(1, (NOW - c.first) / DAY / 30.44));
  return { pr, n: rows.length, improved, rate: improved / rows.length, avgDelta: avg(ds), top, delta, perMonth: sum(ds) / sum(months),
    dist: pr.kind === "level" ? LEVELS.map(l => [l, rows.filter(c => c.f[pr.a] === l).length, rows.filter(c => c.f[pr.b] === l).length]) : null,
    avgA: pr.kind === "level" ? null : avg(rows.map(c => +c.f[pr.a])), avgB: pr.kind === "level" ? null : avg(rows.map(c => +c.f[pr.b])) };
}
const resultText = (rs, c) => `${c.f[rs.pr.a]} → ${c.f[rs.pr.b]}${rs.pr.unit || ""}`;

// split of paying clients by one profession field (where they learn, tour language, subject...)
function splitField() {
  const skip = new Set(RESULT_PAIRS.flatMap(r => [r.a, r.b]));
  for (const f of P.fields) {
    if (!f.opts || skip.has(f.k) || f.auto === "segment") continue;
    const by = {}; for (const c of DB.clients) if (c.first) { const v = c.f[f.k]; if (v === "" || v == null) continue; by[v] = by[v] || { v: 0, n: 0 }; by[v].v += c.spent; by[v].n++; }
    const ent = Object.entries(by).sort((a, b) => b[1].v - a[1].v);
    if (ent.length >= 2) return { f, ent };
  }
  return null;
}

/* ---------- clients table: columns that fit how the profession sells ---------- */
function keyField() { return P.fields.find(f => f.k === "level1") || P.fields.find(f => f.auto === "segment") || P.fields.find(f => f.opts && !["mode", "deliv"].includes(f.k)); }
function statusCell(c) { return isVisit() && c.next ? `<span class="pill active">${L("Booked", "Prenotato")}</span>` : pill(c.status); }
function lastSvcName(c) { const s = LX().svcTx[c.id]; const x = s[s.length - 1]; return x ? tr(P.services[x.s]?.n) : "—"; }
function visitDate(c) { if (c.next) return c.next; const X = LX(); const a = X.act[c.id]; return a.length ? new Date(a[a.length - 1]) : c.last; }
function tableCols() {
  const name = { k: "name", lab: Who(false), val: c => c.name, cell: c => `<div class="who">${avatar(c)}<div><b>${esc(c.name)}</b><small>${esc(c.email)}</small></div></div>` };
  const ch = { k: "ch", lab: t("channel"), val: c => chName(c.ch), cell: c => `<span class="chip"><i style="background:${col(c.ch)}"></i>${esc(chName(c.ch))}</span>` };
  const spent = { k: "spent", lab: t("spent"), num: 1, val: c => c.spent, cell: c => `<b>${eur(c.spent)}</b>` };
  const status = { k: "status", lab: t("status"), val: c => (c.next ? -1 : ["active", "risk", "lapsed", "lead"].indexOf(c.status)), cell: statusCell };
  if (isVisit()) {
    const rf = ratingField();

      { k: "svc", lab: Cap(unit(false)), val: lastSvcName, cell: c => esc(lastSvcName(c)) },
      { k: "date", lab: L("Date", "Data"), val: c => +(visitDate(c) || 0), cell: c => c.next ? `<b>${fdate(c.next)}</b>` : fdate(visitDate(c)) },
      ...(hasSize() ? [{ k: "size", lab: L("People", "Persone"), num: 1, val: c => c.size || 1, cell: c => nf(c.size || 1) }] : []),
      ch, { k: "origin", lab: t("origin"), val: c => c.origin, cell: c => esc(c.origin) },
      ...(rf ? [{ k: "rating", lab: "★", num: 1, val: c => +c.f[rf.k] || 0, cell: c => +c.f[rf.k] > 0 ? `<span style="color:var(--sun)">${"★".repeat(+c.f[rf.k])}</span>` : `<span class="faint">—</span>` }] : []),

/* ---------- insights that only make sense for one kind of business ---------- */
function lensInsights(out) {
  if (isVisit()) {
    const r = rangeFor("12"), v = VS(r.a, r.b), rv = reviewsIn(r.a, r.b), groups = DB.clients.filter(c => c.first && c.last && inR(c.last, r.a, r.b)).length;
    if (ratingField() && groups >= 20) { const rate = rv.n / groups; if (rate < .5) out.push({ tag: "opp", score: 8.1, title: L(`Only ${pct(rate)} of ${who()} leave a review`, `Solo il ${pct(rate)} ${degliWho()} lascia una recensione`), text: L(`${nf(groups - rv.n)} ${who()} in the last 12 months did not write one. A short message with the link on the evening of the ${unit(false)} is the cheapest way to rank higher where new ${who()} search.`, `${nf(groups - rv.n)} ${who()} negli ultimi 12 mesi non l'hanno scritta. Un breve messaggio con il link la sera stessa è il modo più economico per salire dove i nuovi ${who()} cercano.`), impact: [L("Reviews missing", "Recensioni mancanti"), nf(groups - rv.n)] }); }
    if (v.leads.length >= 30) { const late = v.leads.filter(d => d <= 3).length / v.leads.length; if (late >= .25) out.push({ tag: "idea", score: 7.2, title: L(`${pct(late)} of bookings arrive in the last 3 days`, `Il ${pct(late)} delle prenotazioni arriva negli ultimi 3 giorni`), text: L(`Last-minute ${who()} decide on their phone, on the spot. Keeping availability open on the channels they use and answering messages fast is worth more than early-bird discounts.`, `Chi prenota all'ultimo decide dal telefono, sul posto. Tenere aperta la disponibilità sui canali che usano e rispondere in fretta vale più degli sconti per chi prenota prima.`), impact: [L("Median lead", "Anticipo mediano"), nf(v.lead) + " " + L("days", "giorni")] }); }
    const fw = forward(30); if (fw.ly) { const p = (hasSize() ? fw.guests / fw.ly.guests : fw.groups / Math.max(1, fw.ly.groups)) - 1; if (Math.abs(p) >= .1) out.push({ tag: p > 0 ? "info" : "risk", score: p > 0 ? 6.5 : 8.4, title: p > 0 ? L(`Next month is ${pct(p)} ahead of last year`, `Il prossimo mese è avanti del ${pct(p)} sull'anno scorso`) : L(`Next month is ${pct(-p)} behind last year`, `Il prossimo mese è indietro del ${pct(-p)} sull'anno scorso`), text: p > 0 ? L("Bookings already in the calendar are above the same point last year. Check that guides and capacity are ready.", "Le prenotazioni già in calendario sono sopra lo stesso momento dell'anno scorso. Verifica che disponibilità e posti siano pronti.") : L("Fewer bookings are in the calendar than at this point last year. A push on the channels that bring last-minute bookings can still fill the gap.", "In calendario ci sono meno prenotazioni rispetto a questo momento l'anno scorso. Una spinta sui canali che portano prenotazioni last minute può ancora colmare il divario."), impact: [L("Booked, 30 days", "Prenotati, 30 giorni"), nf(hasSize() ? fw.guests : fw.groups)] }); }
  } else {
    const s = survival(); if (s.n >= 20) { const early = 1 - s.S[2]; if (early >= .2) { const lost = Math.round(s.n * early), val = lifetimeValue(); out.push({ tag: "opp", score: 8.7, title: L(`${pct(early)} of ${who()} stop within two months`, `Il ${pct(early)} ${degliWho()} si ferma entro due mesi`), text: L(`The first weeks decide whether a ${who(false)} stays. A short check-in after the third ${unit(false)} (how is it going, what would you change) and a clear plan for the next month keep more of them.`, `Le prime settimane decidono se un ${who(false)} resta. Un breve confronto dopo la terza ${unit(false)} (come va, cosa cambieresti) e un piano chiaro per il mese dopo ne trattengono di più.`), impact: [L("Keeping 1 in 5 of them", "Trattenerne 1 su 5"), eurK(lost * .2 * val * .5)] }); } }
    const r = rangeFor("12"), rn = renewalIn(r.a, r.b); if (rn != null && rn < .6 && hasPack()) out.push({ tag: "opp", score: 8, title: L(`${pct(rn)} of finished packages are renewed`, `Il ${pct(rn)} dei pacchetti finiti viene rinnovato`), text: L(`Propose the next package one or two ${unit()} before the end, with the progress made so far in front of the ${who(false)}. It is easier than finding a new ${who(false)}.`, `Proponi il pacchetto successivo una o due ${unit()} prima della fine, mostrando i progressi fatti. È più facile che trovare un nuovo ${who(false)}.`), impact: [L("Renewal rate", "Tasso di rinnovo"), pct(rn)] });
  }
}

/* ================= day register: record a day's lessons or tours in a few taps =================
   Recurring professions: who came, who missed, credit left, payments to collect, and a quick add
   for anyone who came without a booking. One-off professions: the day's bookings, show or no-show,

/* ---------- backup: every client workspace in one file (works inside and outside Claude) ---------- */
function readCollOnce(coll) {
  return new Promise(res => { let un = null, done = false; const fin = v => { if (done) return; done = true; try { un && un(); } catch (e) { } res(v); }; try { un = STORE.db.collection(coll).onSnapshot(sn => fin(sn.docs.filter(d => d.exists).map(d => [d.id, d.data()])), () => fin([])); } catch (e) { fin([]); } setTimeout(() => fin([]), 8000); });
}
async function exportBackup() {
  const docs = {};
  if (STORE.db) {
    const ws = await readCollOnce("workspaces");
    for (const [id, meta] of ws) { docs[wsPath(id)] = meta; for (const [k, ch] of await readCollOnce(wsPath(id) + "/chunks")) docs[wsPath(id) + "/chunks/" + k] = ch; }
  }
  const profiles = PROFILES.map(({ imported, ...p }) => p);
  return { type: "clientela-backup", version: 1, exported: new Date().toISOString(), docs, profiles };
}
async function importBackup(obj) {
  if (!obj || typeof obj !== "object") throw new Error("format");
  let nProf = 0, nWs = 0;
  if (obj.type === "clientela-profile" && obj.profile) obj = { profiles: [obj.profile] };
  if (Array.isArray(obj.profiles) && obj.profiles.length) nProf = saveImportedProfiles(obj.profiles);
  if (obj.docs && typeof obj.docs === "object") {
    if (!STORE.db) throw new Error(L("Saved clients are not available here.", "I clienti salvati non sono disponibili qui."));
    const paths = Object.keys(obj.docs).filter(p => /^workspaces\/[A-Za-z0-9_-]+(\/chunks\/[A-Za-z0-9_-]+)?$/.test(p));
    // chunks first, settings last, so a workspace never opens half empty
    paths.sort((a, b) => b.split("/").length - a.split("/").length);

}

/* ================= import from a student portal export (CSV of students, packages, lessons) =================
   The portal keeps students, packages and lessons in Supabase. Lucia exports the three tables
   as CSV (Table editor > table > Export > CSV) and drops them here. The portal is the source of
   truth: a student imported again gets their packages and lessons rebuilt, so re-importing every
   month never duplicates anything. The starting level is kept from the first import, so levels
   gained later show up as progress. */
function portalTables(texts) {
  const out = {};
  for (const txt of texts) {
    const rows = parseCSV(txt); if (!rows.length) continue;
    const head = rows[0].map(h => h.trim().toLowerCase().replace(/^"|"$/g, ""));
    const objs = rows.slice(1).map(r => Object.fromEntries(head.map((h, i) => [h, (r[i] ?? "").trim()])));
    if (head.includes("full_name")) out.students = objs;
    else if (head.includes("lessons_total")) out.packages = objs;
    else if (head.includes("starts_at")) out.lessons = objs;
  }
  return out;
}
function clearHistory(ids) {
  if (!ids.size) return;
  DB.txns = DB.txns.filter(x => !ids.has(x.c)).map((x, i) => ({ ...x, id: i }));
  DB.books = DB.books.filter(x => !ids.has(x.c));
  DB.upcoming = (DB.upcoming || []).filter(x => !ids.has(x.c));
  DB.clients.forEach(c => c.txIdx = []); DB.txns.forEach(x => DB.clients[x.c].txIdx.push(x.id));
}
const GOAL_SEG = [[/travel|holiday|vacan|viagg|trip|cultur/i, 0], [/partner|family|famil|wife|husband|boyfriend|girlfriend|moglie|marito|fidanzat/i, 1], [/work|job|career|business|lavoro|colleg/i, 2], [/mov|living|live in|relocat|trasfer/i, 3], [/exam|univers|cils|celi|plida|school|esame/i, 4]];
function importPortal(texts) {
  const T0 = portalTables(texts);
  if (!T0.students) return { error: L("Add at least the students file (students.csv) from the portal export.", "Aggiungi almeno il file degli studenti (students.csv) dall'export del portale.") };
  const pkgs = T0.packages || [], lessons = T0.lessons || [];
  if (!STORE.active) { DB = { clients: [], txns: [], books: [], upcoming: [] }; }
  let newSettings = false;
  const findCh = re => P.channels.findIndex(c => re.test(tr(c.n)));
  const chOther = () => { let i = findCh(/not recorded|non registrato/i); if (i < 0) { P.channels.push({ id: "h" + Date.now().toString(36), n: L("Other / not recorded", "Altro / non registrato"), spend: 0, comm: 0 }); newSettings = true; i = P.channels.length - 1; } return i; };
  const chSite = () => { const i = findCh(/website|sito|\bsite\b|google search|ricerca google/i); return i >= 0 ? i : chOther(); };
  const svcBy = re => P.services.findIndex(s => re.test(tr(s.n)));
  const trialIdx = () => { let i = P.services.findIndex(s => s.trial); if (i < 0) { P.services.unshift({ id: "s" + Date.now().toString(36), n: L("Free trial", "Prova gratuita"), p: 0, kind: "oneoff", trial: true }); newSettings = true; remapUnshift(); i = 0; } return i; };
  const remapUnshift = () => { DB.txns.forEach(x => { if (x.k === "svc") x.s++; }); DB.books.forEach(b => b.s++); (DB.upcoming || []).forEach(b => b.s++); DB.clients.forEach(c => { if (c.sub != null) c.sub++; }); };
  const svcForPkg = p => {
    const title = (p.title || "").trim(), n = +p.lessons_total || 0, price = p.price_eur === "" || p.price_eur == null ? null : +p.price_eur;
    let i = P.services.findIndex(s => tr(s.n).toLowerCase() === title.toLowerCase());
    if (i < 0 && /group|gruppo/i.test(title)) i = svcBy(/group|gruppo/i);
    if (i < 0 && /compan|azien|firm/i.test(title)) i = svcBy(/compan|azien/i);
    if (i < 0 && n === 1) i = P.services.findIndex(s => s.kind === "oneoff" && !s.trial);
    if (i < 0) i = P.services.findIndex(s => s.kind === "pack" && +s.sessions === n && !/group|gruppo|compan|azien/i.test(tr(s.n)));
    if (i < 0) { P.services.push({ id: "s" + Date.now().toString(36) + P.services.length, n: title || n + " " + L("lessons", "lezioni"), p: price || 0, kind: n > 1 ? "pack" : "oneoff", ...(n > 1 ? { sessions: n } : {}) }); newSettings = true; i = P.services.length - 1; }
    return i;
  };
  const byEmail = new Map(DB.clients.map(c => [(c.email || "").toLowerCase(), c]));
  const pkgOf = new Map(), stOf = new Map();
  const reset = new Set(); const touched = new Set(); let nNew = 0, nUpd = 0, nPay = 0, nSess = 0;
  const seen = new Map();
  for (const s of T0.students) {
    const email = (s.email || "").toLowerCase(), name = s.full_name || s.email; if (!name) continue;
    let c = email && byEmail.get(email);
    if (c) { reset.add(c.id); nUpd++; }
    seen.set(s.id, { s, c });
  }
  clearHistory(reset);
  const ti = lessons.some(l => l.kind === "trial") ? trialIdx() : -1; // resolve before packages map to service indexes
  const modeOf = sid => { const ls = lessons.filter(l => l.student_id === sid && l.status !== "cancelled"); const pr = ls.filter(l => l.mode === "prague").length; return ls.length ? (pr > ls.length / 2 ? "prague" : "online") : null; };
  const modeField = P.fields.find(f => f.k === "mode");
  for (const [sid, o] of seen) {
    const s = o.s, mode = modeOf(sid), created = s.created_at ? new Date(s.created_at) : new Date();
    const tzCity = (s.tz || "").split("/").pop().replace(/_/g, " ");
    const origin = mode === "prague" || /prague|praha/i.test(s.tz || "") && mode !== "online" ? "Prague" : "Online" + (tzCity ? " · " + tzCity : "");
    const goal = s.goal || "", seg = (GOAL_SEG.find(([re]) => re.test(goal)) || [0, 0])[1];
    const f = { ...(o.c?.f || {}) };
    if (s.level) { f.level1 = s.level; if (!f.level0) f.level0 = s.level; }
    if (modeField && mode) f.mode = mode === "prague" ? modeField.opts[0][0] : modeField.opts[1][0];
    let c = o.c;
    if (!c) { c = addClient({ name: s.full_name || s.email, email: s.email || "", origin, ch: s.source === "site" ? chSite() : chOther(), seg: Math.min(seg, P.segments.length - 1), f, created, note: goal ? L("Goal: ", "Obiettivo: ") + goal : "" }); nNew++; }
    else { Object.assign(c, { name: s.full_name || c.name, origin: c.origin && c.origin !== "—" ? c.origin : origin, f }); if (created < c.created) c.created = created; if (!c.note && goal) c.note = L("Goal: ", "Obiettivo: ") + goal; }
    stOf.set(sid, c); touched.add(c);
  }
  for (const p of pkgs) {
    const c = stOf.get(p.student_id); if (!c) continue;
    const si = svcForPkg(p); pkgOf.set(p.id, si);
    const amt = p.price_eur === "" || p.price_eur == null ? P.services[si]?.p || 0 : +p.price_eur;
    if (!(amt > 0)) continue;
    addPayment(c, { k: "svc", s: si, a: amt, d: p.created_at ? new Date(p.created_at) : new Date(), m: "Bank transfer", st: /^(true|t|1|yes)$/i.test(p.paid || "") ? "paid" : "pending" });
    nPay++;
  }
  for (const l of lessons) {
    const c = stOf.get(l.student_id); if (!c || l.status === "cancelled" || !l.starts_at) continue;
    const d = new Date(l.starts_at); if (isNaN(d)) continue;
    let si = l.kind === "trial" ? ti : pkgOf.get(l.package_id);
    if (si == null) si = l.kind === "group" ? svcBy(/group|gruppo/i) : P.services.findIndex(s => s.kind === "oneoff" && !s.trial);
    if (si == null || si < 0) si = 0;
    addSession(c, { d, s: si, ns: l.status === "missed" ? 1 : 0 }, true); nSess++;
  }
  for (const c of touched) refreshClient(DB, c);
  if (STORE.active) {
    if (newSettings) { const clean = { services: P.services.map(s => ({ ...s, n: tr(s.n) })), channels: P.channels.map(c => ({ id: c.id, n: tr(c.n), spend: c.spend || 0, comm: c.comm || 0 })) }; saveMeta(clean); Object.assign(STORE.meta, clean); }

  }

}

}
function saveChannels(el) {
  const nc = readRows(el, ".ed-r.ch", (r, old, j) => { const n = $(".n", r).value.trim(); if (!n) return null; return { ...(old || {}), id: old?.id || "h" + Date.now().toString(36) + j, n: old && tr(old.n) === n ? old.n : n, spend: +$(".p", r).value || 0, comm: clamp((+$(".c", r).value || 0) / 100, 0, .6), w: old?.w ?? .05, conv: old?.conv ?? .4 }; });
  if (!nc.length) { toast(L("Keep at least one channel.", "Tieni almeno un canale.")); return; }
  remap("ch", P.channels, nc); P.channels = nc;
  if (STORE.active) { const clean = nc.map(c => ({ id: c.id, n: tr(c.n), spend: c.spend, comm: c.comm })); saveMeta({ channels: clean }); STORE.meta.channels = clean; P.channels = clean; }
  computeMonthly(); renderView(); toast(t("saved"));
}
async function doExport(kind) {
  const data = exportCSV(kind), filename = slug(bizName()) + "-" + kind + "-" + isoDay(NOW) + ".csv";
  if (STORE.downloads) { try { const r = await STORE.downloads.save({ filename, data: "﻿" + data }); if (r?.status === "saved") toast(L("File saved", "File salvato")); } catch (e) { if (e?.code !== "cancelled" && e?.code !== "declined") showCsv(kind, data); } }
  else showCsv(kind, data);
}
function showCsv(kind, data) {
  const f = modal(L("Copy your data", "Copia i tuoi dati"), `<div class="fld full"><label for="csvOut">${L("Select all and paste into Excel or Google Sheets", "Seleziona tutto e incolla in Excel o Google Sheets")}</label><textarea id="csvOut" class="note" style="min-height:240px;font:400 .74rem var(--f-mono)" readonly>${esc(data.slice(0, 400000))}</textarea></div>`, () => null);
  const ta = $("#csvOut", f); ta.focus(); ta.select();
  $("button[type=submit]", f).textContent = t("copy");
  f.onsubmit = e => { e.preventDefault(); try { navigator.clipboard.writeText(data).then(() => toast(L("Copied", "Copiato")), () => ta.select()); } catch (err) { ta.select(); } };
}

/* ================= shell ================= */
APP.demoNames = {};
const bizName = () => STORE.active ? (STORE.meta?.name || "—") : demoName();
const NAV = ["overview", "today", "clients", "revenue", "marketing", "retention", "schedule", "|", "insights", "simulator", "report", "|", "data"];
function renderNav() {
  $("#nav").innerHTML = NAV.map(v => v === "|" ? `<div class="sep"></div>` : `<button type="button" data-view="${v}" aria-current="${APP.view === v}">${icon(NAV_ICONS[v])}<span>${v === "clients" ? Who() : v === "retention" && isVisit() ? L("Reviews & returns", "Recensioni e ritorni") : t("nav_" + v)}</span></button>`).join("");
}
function crumb() {
  const prof = tr(P.name);
  if (STORE.active) return prof + " › " + L("Real data", "Dati reali");
  if (P.profile) { const pr = profileById(P.profile); return prof + " › " + (pr ? stageLabel(pr) + " · " : "") + L("simulated data", "dati simulati"); }
  return prof + " › " + L("Example", "Esempio");
}
function renderTop() {
  $$("[data-i]").forEach(e => e.textContent = t(e.dataset.i));
  const biz = $("#biz"); if (document.activeElement !== biz) biz.value = bizName();
  $('label[for="biz"]').textContent = crumb();
  const pc = cssv(P.color);
  const btn = $("#profBtn"); btn.style.setProperty("--pc", pc);
  btn.innerHTML = `<span class="prof-ico" style="--pc:${pc}">${icon(ICONS[P.id])}</span><span>${esc(L("Clients", "Clienti"))}</span><svg class="chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>`;
  btn.title = L("Change client or category", "Cambia cliente o categoria");
  $("#period").innerHTML = [["30", "p30"], ["90", "p90"], ["12", "p12"], ["all", "pall"]].map(([v, k]) => `<button type="button" data-p="${v}" aria-pressed="${PERIOD === v}">${t(k)}</button>`).join("");
  $$("#lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.l === LANG));
  const pill = $(".demo-pill"); pill.hidden = STORE.active;
  let ss = $("#saveState"); if (!ss) { ss = document.createElement("span"); ss.id = "saveState"; ss.className = "save-state hide-sm"; pill.after(ss); savingEl = ss; }
  ss.hidden = !STORE.active; if (STORE.active && ss.dataset.on !== "1") ss.textContent = L("Saved", "Salvato");
  document.documentElement.lang = LANG;
  renderNav();
}
function renderView() {
  APP.stale = false; hideTip();
  const d = document.createElement("section"); d.className = "view"; d.id = "v-" + APP.view;
  viewsEl.innerHTML = ""; viewsEl.appendChild(d);
  try { VIEWS[APP.view](d); } catch (e) { console.error(e); d.innerHTML = `<div class="panel"><h3>${L("This section could not be drawn.", "Questa sezione non si è caricata.")}</h3><p class="muted-p">${esc(e.message)}</p></div>`; }
  APP.lastW = viewsEl.clientWidth;
}
function renderViewQuiet() { if (layer.children.length) APP.stale = true; else renderView(); }
function go(v) { if (v !== APP.view) APP.importMsg = ""; APP.view = v; try { localStorage.setItem("clientela.view", v); } catch (e) { } renderNav(); renderView(); scrollTo({ top: 0, behavior: "smooth" }); }

/* client picker: profession categories, and inside each the clients Gabri works with */
let PICKER = null;
function openPicker(cat) {
  APP.pickCat = cat || P.id;
  PICKER = document.createElement("div"); PICKER.className = "picker"; PICKER.setAttribute("role", "dialog"); PICKER.setAttribute("aria-modal", "true"); PICKER.setAttribute("aria-label", L("Clients", "Clienti"));
  document.body.appendChild(PICKER); refreshPicker();
  PICKER.addEventListener("click", e => {
    if (e.target === PICKER || e.target.closest("[data-pclose]")) return closePicker();
    const c = e.target.closest("[data-cat]"); if (c) { APP.pickCat = c.dataset.cat; APP.showNew = false; refreshPicker(); return; }
    const p = e.target.closest("[data-demo]"); if (p) { closePicker(); openDemo(p.dataset.demo); return; }
    const w = e.target.closest("[data-ws]"); if (w) { closePicker(); openWorkspace(w.dataset.ws); return; }
    const n = e.target.closest("[data-newws]"); if (n) { APP.showNew = true; APP.newPrefill = n.dataset.newws ? { profile: n.dataset.newws } : null; refreshPicker(); setTimeout(() => $("#nw_name")?.focus(), 30); }
  });
}
function closePicker() { PICKER?.remove(); PICKER = null; APP.showNew = false; APP.newPrefill = null; }
const stageLabel = pr => tr(STAGE[pr.stage] || STAGE.client);
function catCount(id) { return profilesOf(id).length + (STORE.db ? STORE.list.filter(w => w.prof === id).length : 0); }
function refreshPicker() {
  if (!PICKER) return;
  const cat = PROF.find(p => p.id === APP.pickCat) || PROF[0], pc = cssv(cat.color);
  const profs = profilesOf(cat.id), saved = STORE.db ? STORE.list.filter(w => w.prof === cat.id) : [];
  const curDemo = !STORE.active ? APP.demoKey : null;
  const opt = (attrs, pressed, title, sub, tag) => `<button type="button" class="ws-opt" ${attrs} aria-pressed="${pressed}" style="--pc:${pc}"><span class="prof-ico">${icon(ICONS[cat.id])}</span><span style="min-width:0;flex:1"><b>${esc(title)}</b><small>${esc(sub)}</small></span>${tag ? `<span class="ws-tag ${tag[0]}">${esc(tag[1])}</span>` : ""}</button>`;
  const rows = [
    ...profs.map(pr => opt(`data-demo="@${esc(pr.id)}"`, curDemo === "@" + pr.id, pr.name, [pr.owner, pr.site].filter(Boolean).join(" · ") || stageLabel(pr), ["sim", stageLabel(pr) + " · " + L("simulated", "simulato")])),
    ...saved.map(w => opt(`data-ws="${esc(w.id)}"`, STORE.wsId === w.id, w.name, (w.profile && profileById(w.profile) ? profileById(w.profile).name + " · " : "") + L("updated", "aggiornato") + " " + fdate(w.updated ? new Date(w.updated) : null, { day: "numeric", month: "short" }), ["real", L("Real data", "Dati reali")])),
  ];
  const canSave = !!STORE.db;
  const pre = APP.newPrefill || {}, preP = pre.profile ? profileById(pre.profile) : null;
  const form = APP.showNew && canSave ? `<form class="form new-ws" id="nwF" style="padding:14px 0 0">
      ${fld("nw_name", L("Client name", "Nome cliente"), inp("nw_name", preP ? preP.name : "", "text", 'autocomplete="off" required'), "full")}
      ${profs.length ? fld("nw_from", L("Start from", "Parti da"), selI("nw_from", [["", L("Standard " + tr(cat.name).toLowerCase() + " settings", "Impostazioni standard " + tr(cat.name).toLowerCase())], ...profs.map(p => [p.id, L("Profile: ", "Profilo: ") + p.name])], preP ? preP.id : ""), "full", L("A profile brings its price list, channels and fields. Clients start empty.", "Un profilo porta listino, canali e campi. I clienti partono vuoti.")) : ""}
      ${fld("nw_cur", L("Currency", "Valuta"), selI("nw_cur", CURRENCIES.map(c => [c, c]), "EUR"))}
      ${fld("nw_start", L("Consulting start date", "Inizio consulenza"), inp("nw_start", isoDay(NOW), "date"), "", L("Optional", "Facoltativo"))}
      ${fld("nw_goal", L("Monthly revenue goal", "Obiettivo ricavi mensile"), inp("nw_goal", "", "number", 'min="0" step="50" inputmode="numeric"'), "", L("Optional", "Facoltativo"))}
      <div class="err" hidden></div>
      <div class="acts" style="grid-column:1/-1"><button type="submit" class="btn main">${L("Create client workspace", "Crea spazio cliente")}</button></div></form>` : "";
  const note = !canSave ? `<div class="note-box" style="margin-top:10px">${icon(IC.info)}<div>${STORE.listReady ? L("Saved clients open when this page is viewed signed in, by its owner or an editor. Profiles and examples work everywhere.", "I clienti salvati si aprono quando la pagina è vista da loggati, dal proprietario o da un editor. Profili ed esempi funzionano ovunque.") : L("Connecting to your saved clients…", "Collegamento ai clienti salvati…")}</div></div>` : "";
  PICKER.innerHTML = `<div class="picker-card"><div class="ph"><div><h3>${L("Clients", "Clienti")}</h3><p class="sub" style="margin:4px 0 0">${L("Pick the category, then the professional. Each client keeps its own data.", "Scegli la categoria, poi il professionista. Ogni cliente ha i suoi dati.")}</p></div><button class="x" data-pclose aria-label="Close" style="border:0;background:var(--soft);width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none">${icon(IC.x)}</button></div>
    <div class="cats" role="tablist">${PROF.map(p => { const n = catCount(p.id); return `<button type="button" role="tab" class="cat" data-cat="${p.id}" aria-selected="${p.id === cat.id}" style="--pc:${cssv(p.color)}"><span class="prof-ico">${icon(ICONS[p.id])}</span><span>${esc(tr(p.name))}</span>${n ? `<em>${n}</em>` : ""}</button>`; }).join("")}</div>
    <div class="cat-body" style="--pc:${pc}">
      <span class="eyebrow" style="display:block;margin:2px 0 8px">${L("Your clients", "I tuoi clienti")} · ${esc(tr(cat.name))}</span>
      <div class="ws-list">${rows.join("")}${canSave ? `<button type="button" class="ws-opt add" data-newws=""><span class="prof-ico" style="--pc:var(--ink)">${icon(IC.plus)}</span><span><b>${L("New client", "Nuovo cliente")}</b><small>${L("Real data, saved and private to you", "Dati reali, salvati e privati")}</small></span></button>` : ""}</div>
      ${!rows.length && !canSave ? `<p class="muted-p" style="margin:6px 0 0">${L("No clients in this category yet.", "Ancora nessun cliente in questa categoria.")}</p>` : ""}
      ${form}${note}
      <span class="eyebrow" style="display:block;margin:18px 0 8px">${L("Example to show prospects", "Esempio da mostrare ai potenziali clienti")}</span>
      <div class="ws-list">${opt(`data-demo="${cat.id}"`, curDemo === cat.id, APP.demoNames[cat.id] || cat.biz, tr(cat.blurb), ["sim", L("Simulated", "Simulato")])}</div>
    </div></div>`;
  const f = $("#nwF", PICKER);
  if (f) f.onsubmit = async e => {
    e.preventDefault(); const fd = Object.fromEntries(new FormData(f));
    if (!fd.nw_name.trim()) { const er = $(".err", f); er.textContent = L("Give the client a name.", "Dai un nome al cliente."); er.hidden = false; return; }
    $("button[type=submit]", f).disabled = true;
    const id = await createWorkspace({ name: fd.nw_name.trim(), prof: cat.id, profile: fd.nw_from || null, cur: fd.nw_cur, start: fd.nw_start || null, goal: fd.nw_goal });
    if (id) { closePicker(); toast(L("Client workspace created", "Spazio cliente creato")); go("data"); } else $("button[type=submit]", f).disabled = false;
  };
  const sel = $(`.cat[aria-selected="true"]`, PICKER); if (sel && sel.scrollIntoView) sel.scrollIntoView({ block: "nearest", inline: "nearest" });
}

/* global events */
document.addEventListener("click", e => {
  const v = e.target.closest("[data-view]"); if (v) return go(v.dataset.view);
  const g = e.target.closest("[data-go]"); if (g) return go(g.dataset.go);
  const p = e.target.closest("#period [data-p]"); if (p) { PERIOD = p.dataset.p; renderTop(); renderView(); return; }
  const l = e.target.closest("#lang [data-l]"); if (l) { LANG = l.dataset.l; try { localStorage.setItem("clientela.lang", LANG); } catch (err) { } if (!STORE.active) { /* demo names follow language */ } renderTop(); renderView(); return; }
  if (e.target.closest("#profBtn")) return openPicker();
  const a = e.target.closest("[data-act]")?.dataset.act;
  if (a === "addClient" && !e.target.closest(".drawer")) return clientModal();
  if (a === "goData") return go("data");
  if (a === "goSettings") { APP.scrollTo = "settings"; return go("data"); }
  if (a === "newWs") { openPicker(); APP.showNew = true; APP.newPrefill = P.profile && !STORE.active ? { profile: P.profile } : null; refreshPicker(); return; }
  if (a === "recordPlans") return recordPlans();
  const c = e.target.closest("[data-client]"); if (c && !e.target.closest(".drawer,.modal")) return openClient(+c.dataset.client);
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { if (PICKER) closePicker(); else if ($(".modal", layer)) $(".modal", layer).parentElement.remove(); else if (layer.children.length) closeLayer(); }
  if (e.key === "Enter" && e.target.matches("tr[data-client]")) openClient(+e.target.dataset.client);
});
document.addEventListener("pointermove", e => { const c = e.target.closest?.("[data-tip]"); if (c && c.dataset.tip) showTip(`<b>${esc(c.dataset.tip)}</b>`, e.clientX, e.clientY); else if (e.target.closest && e.target.closest(".heat")) hideTip(); });
document.addEventListener("pointerleave", hideTip);
$("#biz").addEventListener("change", e => { const v = e.target.value.trim(); if (!v) { e.target.value = bizName(); return; } if (STORE.active) { saveMeta({ name: v }); toast(t("saved")); } else APP.demoNames[APP.demoKey || P.id] = v; });
let rzT; addEventListener("resize", () => { clearTimeout(rzT); rzT = setTimeout(() => { if (Math.abs(viewsEl.clientWidth - (APP.lastW || 0)) > 40) renderView(); }, 200); });
const _closeLayer = closeLayer;
closeLayer = function () { _closeLayer(); if (APP.stale) renderView(); };

/* monthly plan payments in one tap */
function plansDue() { const m = NM - 1; return DB.clients.filter(c => c.subActive && c.sub != null && !c.txIdx.some(i => { const x = DB.txns[i]; return x.k === "svc" && x.s === c.sub && monthIdx(x.d) === m; })); }
function recordPlans() {
  const due = plansDue(); if (!due.length) return;
  for (const c of due) { const last = c.txIdx.map(i => DB.txns[i]).filter(x => x.k === "svc" && x.s === c.sub).pop(); addPayment(c, { k: "svc", s: c.sub, a: last?.a || P.services[c.sub].p, d: new Date(), m: last?.m || "Card", st: "paid" }); }
  if (STORE.active) { const ks = new Set(due.map(c => persistClient(c, true))); ks.forEach(k => k && queueWrite(k)); }
  afterChange(); toast(L(`${due.length} plan payments recorded`, `${due.length} pagamenti di abbonamenti registrati`));
}

/* ================= boot ================= */
(function boot() {
  LANG = (navigator.language || "en").toLowerCase().startsWith("it") ? "it" : "en";
  try { const sv = localStorage.getItem("clientela.lang"); if (sv === "en" || sv === "it") LANG = sv; } catch (e) { }
  try { const v = localStorage.getItem("clientela.view"); if (v && VIEWS[v]) APP.view = v; } catch (e) { }
  loadImportedProfiles();
  let last = null; try { last = localStorage.getItem("clientela.ws"); } catch (e) { }
  const demoId = last && last.startsWith("demo:") ? last.slice(5) : "tour";
  if (last && !last.startsWith("demo:")) APP.wantWs = last;
  const okDemo = demoId.startsWith("@") ? !!profileById(demoId.slice(1)) : PROF.some(p => p.id === demoId);
  openDemo(okDemo ? demoId : "tour");
  STORE.init();
})();

</script>
